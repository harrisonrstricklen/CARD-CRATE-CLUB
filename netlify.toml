# Production Netlify configuration. Keep function paths and bundled card data here
# because this is the repository-level config Netlify reads for cardcrateclub.netlify.app.
[build]
  publish = "CARD CRATE CLUB"
  functions = "CARD CRATE CLUB/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "CARD CRATE CLUB/card-data/all-cards-index.json",
    "CARD CRATE CLUB/card-data/all-cards-index-ja.json",
    "CARD CRATE CLUB/card-data/all-sets/index.json"
  ]

[functions."refresh-card-prices"]
  schedule = "*/5 * * * *"

[functions."seed-ascended-heroes-master"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://api.pokemontcg.io; frame-src https://cardcrate-club.firebaseapp.com https://accounts.google.com;"
