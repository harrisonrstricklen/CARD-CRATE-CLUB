<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — CardCrate Club</title>
  <meta name="description" content="Join CardCrate Club — create your account to claim a Founding 100 spot and start your Pokémon TCG subscription." />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .auth-shell { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 460px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo-badge { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; font-weight: 900; font-size: 18px; padding: 8px 16px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
    .auth-logo p { color: var(--muted); font-size: 14px; }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pw-strength { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-top: 8px; overflow: hidden; }
    .pw-strength-fill { height: 100%; width: 0%; background: var(--red); transition: width 0.2s, background 0.2s; }
    .auth-footer-link { text-align: center; margin-top: 22px; font-size: 0.85rem; color: var(--muted); }
    .auth-footer-link a { color: var(--gold); font-weight: 600; }
    .auth-footer-link a:hover { text-decoration: underline; }
    .back-link { text-align: center; margin-top: 14px; }
    .back-link a { color: #555; font-size: 13px; }
    .back-link a:hover { color: var(--gold); }
    @media (max-width: 420px) { .name-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- ========== FLOATING POKEMON CARDS BACKGROUND ========== -->
<div class="floating-bg">
  <div class="fc"><img src="https://images.pokemontcg.io/sv3/4.png"       alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv1/47.png"      alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv1/81.png"      alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv1/247.png"     alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv2/86.png"      alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/swsh12/67.png"   alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/swsh4/94.png"    alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/swsh7/111.png"   alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/swsh11/186.png"  alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv3pt5/133.png"  alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv3pt5/151.png"  alt="" loading="lazy"/></div>
  <div class="fc"><img src="https://images.pokemontcg.io/sv3pt5/94.png"   alt="" loading="lazy"/></div>
</div>

<div class="page-wrapper">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-badge">CCC</div>
        <p>Create your CardCrate Club account</p>
      </div>

      <form id="signupFormEl" novalidate>
        <div class="name-row">
          <div class="form-group" id="group-firstName">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Harrison" required />
            <div class="field-error">Required.</div>
          </div>
          <div class="form-group" id="group-lastName">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Stricklen" required />
            <div class="field-error">Required.</div>
          </div>
        </div>

        <div class="form-group" id="group-signupEmail">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required />
          <div class="field-error">Enter a valid email address.</div>
        </div>

        <div class="form-group" id="group-signupPassword">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 8 characters" required />
          <div class="pw-strength"><div class="pw-strength-fill" id="pwFill"></div></div>
          <div class="field-error">Password must be at least 8 characters.</div>
        </div>

        <div class="form-group" id="group-confirmPassword">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
          <div class="field-error">Passwords don't match.</div>
        </div>

        <div class="form-group" id="group-terms" style="margin-bottom: 20px;">
          <label class="checkbox-row">
            <input type="checkbox" id="agreeTerms" />
            <span>I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a></span>
          </label>
          <div class="field-error">You must agree to continue.</div>
        </div>

        <button type="submit" class="btn btn-gold btn-block btn-lg">Create Account</button>
      </form>

      <div class="alert" id="authMessage"></div>

      <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
      <div class="back-link"><a href="index.html">← Back to Home</a></div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpx0EZyq2CdDru3UBDGlpA2qcUiqt0ed8",
    authDomain: "cardcrate-club.firebaseapp.com",
    projectId: "cardcrate-club",
    storageBucket: "cardcrate-club.firebasestorage.app",
    messagingSenderId: "261800955788",
    appId: "1:261800955788:web:3f07f4c60886b26d05d0a9",
    measurementId: "G-5B8J0LWGKE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const msgEl = document.getElementById('authMessage');
  function showMessage(text, type) {
    msgEl.textContent = text;
    msgEl.className = `alert show ${type}`;
  }
  function setFieldError(groupId, hasError) {
    document.getElementById(groupId).classList.toggle('has-error', hasError);
  }

  // Live password strength meter
  const pwInput = document.getElementById('signupPassword');
  const pwFill = document.getElementById('pwFill');
  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const pct = (score / 4) * 100;
    pwFill.style.width = pct + '%';
    pwFill.style.background = score <= 1 ? 'var(--red)' : score === 2 ? '#e0a030' : score === 3 ? '#a0d060' : 'var(--green)';
  });

  function validate() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const agree = document.getElementById('agreeTerms').checked;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const pwOk = password.length >= 8;
    const matchOk = password === confirm && confirm.length > 0;

    setFieldError('group-firstName', firstName.length === 0);
    setFieldError('group-lastName', lastName.length === 0);
    setFieldError('group-signupEmail', !emailOk);
    setFieldError('group-signupPassword', !pwOk);
    setFieldError('group-confirmPassword', !matchOk);
    setFieldError('group-terms', !agree);

    return firstName && lastName && emailOk && pwOk && matchOk && agree;
  }

  document.getElementById('signupFormEl').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validate()) return;

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const displayName = `${firstName} ${lastName}`;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName });

      // Create the user's Firestore profile document.
      // NOTE: memberNumber/foundingMember status should ultimately be assigned
      // by a backend function (to guarantee sequential, race-safe numbering)
      // rather than the client — placeholder fields only for now.
      await setDoc(doc(db, 'users', cred.user.uid), {
        firstName,
        lastName,
        email,
        createdAt: serverTimestamp(),
        subscription: null,
        crateCoins: 0,
        memberNumber: null,
        foundingMember: null
      });

      showMessage('🎉 Account created! Redirecting to onboarding...', 'success');
      const requestedPlan = new URLSearchParams(window.location.search).get('plan');
      const nextUrl = requestedPlan ? `onboarding.html?plan=${encodeURIComponent(requestedPlan)}` : 'onboarding.html';
      setTimeout(() => window.location.href = nextUrl, 1200);
    } catch (err) {
      showMessage('❌ ' + (err.message || 'Could not create account.'), 'error');
    }
  });
</script>

</body>
</html>
