name: Test live pricing relay
on:
  push:
    paths:
      - '.github/workflows/test-live-pricing-relay.yml'
      - 'netlify.toml'
      - 'CARD CRATE CLUB/netlify/functions/search-cards.js'
      - 'CARD CRATE CLUB/netlify/functions/_tcgcsv.js'
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify and verify price plus TCGplayer relay
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base='https://cardcrateclub.netlify.app/.netlify/functions/search-cards'
          tests=[
            dict(q='Mega Meganium ex',set='Ascended Heroes',number='10',variant='Holofoil',id='me2pt5-10',expected=0.94,product='675822'),
            dict(q="Acerola's Mischief",set='Ascended Heroes',number='180',id='me2pt5-180',expected=0.14,product='675992'),
          ]
          last=None
          for attempt in range(36):
            results=[]
            ok=True
            try:
              for t in tests:
                qs=urllib.parse.urlencode({k:v for k,v in t.items() if k not in ('id','expected','product')})
                request=urllib.request.Request(base+'?'+qs,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                with urllib.request.urlopen(request,timeout=20) as r:
                  payload=json.load(r)
                card=(payload.get('data') or [None])[0]
                market=((card or {}).get('pricing') or {}).get('market')
                url=((card or {}).get('tcgplayer') or {}).get('url','')
                record={'source':payload.get('source'),'version':payload.get('version'),'id':(card or {}).get('id'),'market':market,'url':url}
                results.append(record)
                if payload.get('version')!='pricing-relay-v5': ok=False
                if not card or card.get('id')!=t['id']: ok=False
                if not isinstance(market,(int,float)) or abs(market-t['expected'])>0.03: ok=False
                if f"tcgplayer.com/product/{t['product']}" not in url: ok=False
              last=results
              if ok:
                print(json.dumps(results,indent=2))
                print('LIVE_PRICING_RELAY_PASS')
                raise SystemExit(0)
              print(f'Attempt {attempt+1}: production has not passed yet')
              print(json.dumps(results,indent=2))
            except Exception as e:
              last={'error':str(e),'results':results}
              print(f'Attempt {attempt+1}: {e}')
            time.sleep(10)
          print('LAST_RESULT',json.dumps(last,indent=2))
          raise SystemExit('Live pricing relay did not pass within polling window')
          PY
