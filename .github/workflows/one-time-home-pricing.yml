name: One-time homepage pricing update

on:
  push:
    paths:
      - '.github/workflows/one-time-home-pricing.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage pricing and founder copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CARD CRATE CLUB/index.html')
          s = p.read_text()
          replacements = {
              '<span class="hero-stat-number">$24</span><span class="hero-stat-label">Starting At</span>': '<span class="hero-stat-number">$29.99</span><span class="hero-stat-label">Starting At</span>',
              '$24.99': '$29.99',
              '$44.99': '$54.99',
              '$64.99': '$74.99',
              '<li>✓ 3–5 Booster Packs</li>': '<li>✓ 4 Booster Packs</li>',
              '<li>✓ 6–10 Booster Packs</li>': '<li>✓ 8 Booster Packs</li>',
              '<li>✓ 12–15 Booster Packs</li>': '<li>✓ 12 Booster Packs</li>',
              'ℹ️ All subscriptions include free shipping. Cancel or pause anytime. Founding Members lock in current pricing forever.': 'ℹ️ Launch pricing reflects the inventory we can reliably source today. As our purchasing power improves, members can benefit through better pack value, added packs, credits, perks, or lower pricing when sustainable.',
              '<div class="benefit"><div class="benefit-icon">💰</div><div class="benefit-text"><strong>Price Lock Guarantee</strong><span>Your subscription price never increases — locked in for life</span></div></div>': '<div class="benefit"><div class="benefit-icon">🎟️</div><div class="benefit-text"><strong>Giveaway Entry for Life</strong><span>One complimentary entry in each eligible Card Crate Club giveaway, subject to official rules</span></div></div>',
              '<div class="benefit"><div class="benefit-icon">⚡</div><div class="benefit-text"><strong>Early Access Forever</strong><span>First access to new tiers, features, and exclusive drops</span></div></div>': '<div class="benefit"><div class="benefit-icon">🛍️</div><div class="benefit-text"><strong>First Store Access</strong><span>First opportunity to shop select new products and limited drops when available</span></div></div>',
              '<div class="perk">✅ <span>Exclusive founding member pricing</span></div>': '<div class="perk">✅ <span>Exclusive founding member perks</span></div>',
              'with a physical collectible card, lifetime price lock, and a permanent member number badge.': 'with a physical collectible card, a permanent member number badge, one complimentary entry in eligible giveaways, and first opportunity at select new store items.',
              '© 2025 CardCrate Club. All rights reserved.': '© 2026 CardCrate Club. All rights reserved.',
              'CCC<span>.</span> <span style="font-weight:700;font-size:0.85rem;letter-spacing:0.04em;">CARDCRATE CLUB</span>': 'CCC <span style="font-weight:700;font-size:0.85rem;letter-spacing:0.04em;">CARDCRATE CLUB</span>',
              '<div class="footer-brand-logo">CCC<span>.</span></div>': '<div class="footer-brand-logo">CCC</div>',
              '>Dashboard</a>`;': '>My Dashboard</a>`;'
          }
          for old, new in replacements.items():
              if old not in s:
                  print('warning: replacement not found:', old[:90])
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit homepage update and remove one-time workflow
        run: |
          git config user.name "Card Crate Club Site Update"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-home-pricing.yml
          git add 'CARD CRATE CLUB/index.html'
          git commit -m "Update homepage launch pricing and founder perks"
          git push
