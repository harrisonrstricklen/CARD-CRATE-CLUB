name: Apply Site Polish

on:
  push:
    paths:
      - 'CARD CRATE CLUB/tools/apply-dashboard-set-polish.py'
      - '.github/workflows/apply-site-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        run: python 'CARD CRATE CLUB/tools/apply-dashboard-set-polish.py'
      - name: Commit updated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CARD CRATE CLUB/dashboard.html' 'CARD CRATE CLUB/set.html'
          git commit -m 'Polish membership dashboard and local set gallery'
          git push
