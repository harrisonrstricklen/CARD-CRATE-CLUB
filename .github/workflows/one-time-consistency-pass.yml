name: One-time pricing consistency pass

on:
  push:
    paths:
      - '.github/workflows/one-time-consistency-pass.yml'

permissions:
  contents: write

jobs:
  consistency-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale founder and dashboard copy
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'CARD CRATE CLUB/faq.html': {
              'CCC<span>.</span>': 'CCC',
              '<div class="footer-brand-logo">CCC<span>.</span></div>': '<div class="footer-brand-logo">CCC</div>',
              '© 2025 CardCrate Club. All rights reserved.': '© 2026 Card Crate Club. All rights reserved.',
              '>Dashboard</a>`;': '>My Dashboard</a>`;',
              "A numbered badge, physical member card, price lock guarantee, bonus Crate Coins, early access, and a Discord role. See the Founding 100 page for the full list.": "A permanent numbered badge, physical Founder card, one complimentary entry in eligible giveaways, first opportunity at select new store items, and other Founder benefits. See the Founding 100 page for the full list."
            },
            'CARD CRATE CLUB/how-it-works.html': {
              '>Dashboard</a>';: '>My Dashboard</a>';
            }
          }
          # Handle how-it-works separately because its JS string includes quotes.
          replacements['CARD CRATE CLUB/how-it-works.html'] = {
            '>Dashboard</a>': '>My Dashboard</a>'
          }
          for path, reps in replacements.items():
            p = Path(path)
            s = p.read_text()
            for old, new in reps.items():
              s = s.replace(old, new)
            p.write_text(s)
          PY
      - name: Commit consistency pass and remove workflow
        run: |
          git config user.name "Card Crate Club Site Update"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-consistency-pass.yml
          git add 'CARD CRATE CLUB/faq.html' 'CARD CRATE CLUB/how-it-works.html'
          git commit -m "Align founder and dashboard copy across site"
          git push
