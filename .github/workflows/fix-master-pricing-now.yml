name: Fix master pricing now
on:
  push:
    paths:
      - '.github/workflows/fix-master-pricing-now.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing refresh and collection trigger
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('CARD CRATE CLUB/netlify/functions/refresh-card-prices.js')
          s = p.read_text()
          s = s.replace("const { getFirebaseAdmin, json } = require('./_shared');", "const { getFirebaseAdmin, json, requireUser } = require('./_shared');")
          s = s.replace("exports.handler = async function() {", "exports.handler = async function(event = {}) {")
          old = """    const admin = getFirebaseAdmin();\n    const db = admin.firestore();\n    const collectionSnap = await db.collectionGroup('collection').get();\n    const wanted = new Map();"""
          new = """    const admin = getFirebaseAdmin();\n    const db = admin.firestore();\n    let collectionSnap;\n    if (event.httpMethod === 'POST') {\n      const user = await requireUser(event);\n      collectionSnap = await db.collection('users').doc(user.uid).collection('collection').get();\n    } else {\n      collectionSnap = await db.collectionGroup('collection').get();\n    }\n    const wanted = new Map();"""
          if old not in s: raise SystemExit('refresh collection scan block not found')
          s = s.replace(old, new)

          anchor = """async function fetchJson(url, timeout = 5000) {\n  const res = await fetch(url, {\n    headers: { 'User-Agent': 'CardCrateClub/1.0 pricing-cache' },\n    signal: AbortSignal.timeout(timeout)\n  });\n  if (!res.ok) throw new Error(`${url} returned ${res.status}`);\n  return res.json();\n}\n"""
          helpers = anchor + """\nfunction normalizeCardNumber(value) {\n  const raw = String(value || '').trim().toLowerCase().split('/')[0].trim();\n  return /^\\d+$/.test(raw) ? String(Number(raw)) : raw;\n}\n\nfunction productCardNumber(product) {\n  const direct = product?.number || product?.cardNumber || '';\n  if (direct) return normalizeCardNumber(direct);\n  for (const row of product?.extendedData || []) {\n    const key = normalizeText(row?.name || row?.displayName || '');\n    if (key === 'number' || key === 'card number') return normalizeCardNumber(row?.value || '');\n  }\n  return '';\n}\n\nfunction resolveProductId(item, products) {\n  const wantedName = normalizeText(item.name);\n  const wantedNumber = normalizeCardNumber(item.number);\n  let best = null, bestScore = -1;\n  for (const product of products || []) {\n    const name = normalizeText(product.name || product.cleanName || '');\n    const number = productCardNumber(product);\n    let score = 0;\n    if (wantedName && name === wantedName) score += 100;\n    else if (wantedName && name.includes(wantedName)) score += 55;\n    else if (wantedName && wantedName.includes(name)) score += 35;\n    if (wantedNumber && number === wantedNumber) score += 120;\n    else if (wantedNumber && number) score -= 80;\n    if (score > bestScore) { bestScore = score; best = Number(product.productId); }\n  }\n  return bestScore >= (wantedNumber ? 120 : 100) && Number.isFinite(best) ? best : null;\n}\n"""
          if 'function resolveProductId(item, products)' not in s:
            if anchor not in s: raise SystemExit('fetchJson anchor not found')
            s = s.replace(anchor, helpers)

          s = s.replace("const unresolved = [...wanted.entries()].filter(([, item]) => !primaryLive.has(item.apiId) && extractProductId(item.tcgplayerUrl));", "const unresolved = [...wanted.entries()].filter(([, item]) => !primaryLive.has(item.apiId));")
          s = s.replace("""    const productId = extractProductId(item.tcgplayerUrl);\n    const groupId = resolveGroupId(item.set, groups);\n    if (!productId || !groupId) continue;\n    if (!byGroup.has(groupId)) byGroup.set(groupId, []);\n    byGroup.get(groupId).push({ key, item, productId });""", """    const productId = extractProductId(item.tcgplayerUrl);\n    const groupId = resolveGroupId(item.set, groups);\n    if (!groupId) continue;\n    if (!byGroup.has(groupId)) byGroup.set(groupId, []);\n    byGroup.get(groupId).push({ key, item, productId });""")
          old_loop = """    try {\n      const payload = await fetchJson(`https://tcgcsv.com/tcgplayer/3/${groupId}/prices`, 4500);\n      const rowsByProduct = new Map();"""
          new_loop = """    try {\n      if (entries.some(entry => !entry.productId)) {\n        const productsPayload = await fetchJson(`https://tcgcsv.com/tcgplayer/3/${groupId}/products`, 4500);\n        const products = productsPayload.results || [];\n        for (const entry of entries) if (!entry.productId) entry.productId = resolveProductId(entry.item, products);\n      }\n      const payload = await fetchJson(`https://tcgcsv.com/tcgplayer/3/${groupId}/prices`, 4500);\n      const rowsByProduct = new Map();"""
          if old_loop not in s: raise SystemExit('fallback loop block not found')
          s = s.replace(old_loop, new_loop)
          s = s.replace("""      for (const entry of entries) {\n        const picked = safePriceRows(rowsByProduct.get(entry.productId) || [], entry.item.priceVariant || entry.item.variance || '', entry.item.rarity, entry.item.name);""", """      for (const entry of entries) {\n        if (!entry.productId) continue;\n        const picked = safePriceRows(rowsByProduct.get(entry.productId) || [], entry.item.priceVariant || entry.item.variance || '', entry.item.rarity, entry.item.name);""")
          p.write_text(s)

          p = Path('CARD CRATE CLUB/collection.html')
          s = p.read_text()
          needle = """onAuthStateChanged(auth,user=>{if(!user){location.href='login.html';return}currentUser=user;avatarBtn.textContent=(user.displayName||user.email).charAt(0).toUpperCase();onSnapshot(collection(db,'users',user.uid,'collection'),snap=>{allCards=snap.docs.map(d=>({id:d.id,...d.data()}));populateSetFilter();renderCards();overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400);clearTimeout(recheckTimer);recheckTimer=setTimeout(()=>recheckSavedCards(false),1200)},()=>{overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400)});setInterval(()=>{if(!document.hidden)recheckSavedCards(false)},RECHECK_INTERVAL_MS)});"""
          repl = """async function requestMasterRefresh(){if(!currentUser||!allCards.length)return;try{const token=await currentUser.getIdToken();const res=await fetch('/.netlify/functions/refresh-card-prices',{method:'POST',headers:{Authorization:`Bearer ${token}`}});if(!res.ok)throw Error(`Master refresh returned ${res.status}`);const data=await res.json();console.info('Master price refresh',data)}catch(e){console.warn('Master price refresh unavailable:',e)}}\nonAuthStateChanged(auth,user=>{if(!user){location.href='login.html';return}currentUser=user;avatarBtn.textContent=(user.displayName||user.email).charAt(0).toUpperCase();onSnapshot(collection(db,'users',user.uid,'collection'),snap=>{allCards=snap.docs.map(d=>({id:d.id,...d.data()}));populateSetFilter();renderCards();overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400);clearTimeout(recheckTimer);recheckTimer=setTimeout(()=>{requestMasterRefresh();recheckSavedCards(false)},1200)},()=>{overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400)});setInterval(()=>{if(!document.hidden)recheckSavedCards(false)},RECHECK_INTERVAL_MS)});"""
          if needle not in s: raise SystemExit('collection auth block not found')
          s = s.replace(needle, repl)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CARD CRATE CLUB/netlify/functions/refresh-card-prices.js" "CARD CRATE CLUB/collection.html"
          git commit -m "Repair master pricing fallback and refresh" || exit 0
          git push
