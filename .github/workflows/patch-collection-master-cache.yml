name: Patch collection master cache
on:
  push:
    paths:
      - '.github/workflows/patch-collection-master-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch collection master pricing integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CARD CRATE CLUB/collection.html')
          s = p.read_text()

          old = "let currentUser=null,allCards=[],recheckRunning=false,recheckTimer=null,selectedSearchCard=null,viewerRequestId=0;const updatingCardIds=new Set();"
          new = "let currentUser=null,allCards=[],recheckRunning=false,recheckTimer=null,selectedSearchCard=null,viewerRequestId=0,masterLookupRunning=false;const updatingCardIds=new Set();"
          if old not in s: raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)

          marker = "async function requestMasterRefresh(){if(!currentUser||!allCards.length)return;try{const token=await currentUser.getIdToken();const res=await fetch('/.netlify/functions/refresh-card-prices',{method:'POST',headers:{Authorization:`Bearer ${token}`}});if(!res.ok)throw Error(`Master refresh returned ${res.status}`);const data=await res.json();console.info('Master price refresh',data)}catch(e){console.warn('Master price refresh unavailable:',e)}}\n"
          insert = marker + "async function loadMasterPrices(){if(masterLookupRunning||!currentUser||!allCards.length)return;masterLookupRunning=true;try{const token=await currentUser.getIdToken();const items=allCards.map(c=>({apiId:c.apiId||null,sourceId:c.sourceId||null,language:c.language||'en',priceVariant:c.priceVariant||'',variance:c.variance||''}));const res=await fetch('/.netlify/functions/get-card-prices',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({items})});if(!res.ok)throw Error(`Master lookup returned ${res.status}`);const data=await res.json();let hits=0;(data.resolved||[]).forEach(r=>{const price=r?.price,card=allCards[r?.index];const n=Number(price?.marketPrice);if(!card||!Number.isFinite(n)||n<=0)return;card.marketPrice=n;card.value=n;card.priceSource='master-cache';card.pricingStatus=price.pricingStatus||'master-default';card.priceVariant=price.priceVariant||card.priceVariant||null;if(price.tcgplayerUrl)card.tcgplayerUrl=price.tcgplayerUrl;card.marketPriceUpdatedAt=price.updatedAt||card.marketPriceUpdatedAt;hits++});if(hits){renderCards();console.info(`Loaded ${hits} prices from master cache`)}else console.info('No master cache prices found yet')}catch(e){console.warn('Master cache lookup unavailable:',e)}finally{masterLookupRunning=false}}\n"
          if marker not in s: raise SystemExit('refresh marker not found')
          s = s.replace(marker, insert, 1)

          old = "recheckTimer=setTimeout(()=>{requestMasterRefresh();recheckSavedCards(false)},1200)},()=>{overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400)});setInterval(()=>{if(!document.hidden)recheckSavedCards(false)},RECHECK_INTERVAL_MS)"
          new = "recheckTimer=setTimeout(async()=>{await requestMasterRefresh();await loadMasterPrices()},1200)},()=>{overlay.classList.add('hide');setTimeout(()=>overlay.style.display='none',400)});setInterval(()=>{if(!document.hidden)loadMasterPrices()},300000)"
          if old not in s: raise SystemExit('snapshot timer marker not found')
          s = s.replace(old, new, 1)

          old = "if((c.matchStatus==='unverified'||c.pricingStatus==='unavailable')&&checkedAtMs(c))return'Price unavailable — will retry';return'Waiting for market price…'"
          new = "if((c.matchStatus==='unverified'||c.pricingStatus==='unavailable')&&checkedAtMs(c))return'Waiting for master price…';return'Waiting for master price…'"
          if old not in s: raise SystemExit('price status marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CARD CRATE CLUB/collection.html'
          git commit -m 'Read collection values directly from master price cache' || exit 0
          git push
