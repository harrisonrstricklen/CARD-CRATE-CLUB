name: Repair master pricing queue
on:
  push:
    paths:
      - '.github/workflows/repair-master-pricing-queue.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch pricing backend and collection refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('CARD CRATE CLUB/netlify/functions/refresh-card-prices.js')
          s = backend.read_text()

          old = "const unresolved = [...wanted.entries()].filter(([, item]) => !primaryLive.has(item.apiId));"
          new = """const unresolved = [...wanted.entries()].filter(([, item]) => {
    const card = primaryLive.get(item.apiId);
    if (!card) return true;
    const picked = safePrice(card, item.priceVariant || item.variance || '');
    return picked.marketPrice == null;
  });"""
          if old not in s:
              raise SystemExit('backend unresolved marker not found')
          s = s.replace(old, new, 1)

          old = """    for (const snap of collectionSnap.docs) {
      const item = snap.data() || {};
      const language = normalizeLanguage(item.language);
      const apiId = String(item.apiId || item.sourceId || '').trim();
      if (!apiId || language !== 'en' || apiId.startsWith('ja:')) continue;
      const key = priceKey(item);"""
          new = """    for (const snap of collectionSnap.docs) {
      const item = snap.data() || {};
      const language = normalizeLanguage(item.language);
      const apiId = String(item.apiId || item.sourceId || '').trim();
      if (!apiId || language !== 'en' || apiId.startsWith('ja:')) continue;
      const priceSource = String(item.priceSource || '');
      const existingMarket = Number(item.marketPrice);
      const updated = item.marketPriceUpdatedAt?.toMillis ? item.marketPriceUpdatedAt.toMillis() : (item.marketPriceUpdatedAt?.seconds ? item.marketPriceUpdatedAt.seconds * 1000 : 0);
      const hasTrustedPrice = Number.isFinite(existingMarket) && existingMarket > 0 && (priceSource.startsWith('master-') || priceSource.startsWith('live-'));
      const fresh = hasTrustedPrice && updated && Date.now() - updated < 240000;
      if (fresh) continue;
      const key = priceKey(item);"""
          if old not in s:
              raise SystemExit('backend collection marker not found')
          s = s.replace(old, new, 1)

          old = """      if (card) {
        picked = safePrice(card, item.priceVariant || item.variance || '');
        master = {
          key, cardId: item.apiId, language: 'en',
          requestedVariant: item.priceVariant || item.variance || null,
          marketPrice: picked.marketPrice, pricingStatus: picked.status, priceVariant: picked.variant,
          name: card.name || item.name, set: card.set?.name || item.set, number: card.number || item.number,
          tcgplayerUrl: card.tcgplayer?.url || item.tcgplayerUrl || '', source: 'tcgplayer', updatedAt: now
        };
      } else if (fallback) {"""
          new = """      const primaryPicked = card ? safePrice(card, item.priceVariant || item.variance || '') : null;
      if (card && primaryPicked?.marketPrice != null) {
        picked = primaryPicked;
        master = {
          key, cardId: item.apiId, language: 'en',
          requestedVariant: item.priceVariant || item.variance || null,
          marketPrice: picked.marketPrice, pricingStatus: picked.status, priceVariant: picked.variant,
          name: card.name || item.name, set: card.set?.name || item.set, number: card.number || item.number,
          tcgplayerUrl: card.tcgplayer?.url || item.tcgplayerUrl || '', source: 'tcgplayer', updatedAt: now
        };
      } else if (fallback) {"""
          if old not in s:
              raise SystemExit('backend primary marker not found')
          s = s.replace(old, new, 1)

          old = """      } else {
        continue;
      }

      priceWrites.push({ ref: db.collection('cardPrices').doc(key), data: master });"""
          new = """      } else if (card && primaryPicked) {
        picked = primaryPicked;
        master = {
          key, cardId: item.apiId, language: 'en',
          requestedVariant: item.priceVariant || item.variance || null,
          marketPrice: null, pricingStatus: picked.status, priceVariant: picked.variant,
          name: card.name || item.name, set: card.set?.name || item.set, number: card.number || item.number,
          tcgplayerUrl: card.tcgplayer?.url || item.tcgplayerUrl || '', source: 'tcgplayer', updatedAt: now
        };
      } else {
        continue;
      }

      priceWrites.push({ ref: db.collection('cardPrices').doc(key), data: master });"""
          if old not in s:
              raise SystemExit('backend fallback marker not found')
          s = s.replace(old, new, 1)
          backend.write_text(s)

          collection = Path('CARD CRATE CLUB/collection.html')
          c = collection.read_text()
          marker = "const $=id=>document.getElementById(id);"
          insert = """async function refreshMasterPrices(){if(!currentUser)return;try{const token=await currentUser.getIdToken();const res=await fetch('/.netlify/functions/refresh-card-prices',{method:'POST',headers:{Authorization:`Bearer ${token}`}});if(!res.ok)throw Error(`Master price refresh returned ${res.status}`);const data=await res.json();console.log('Master price refresh',data)}catch(e){console.warn('Master price refresh failed:',e)}}\n"""
          if insert.strip() not in c:
              if marker not in c:
                  raise SystemExit('collection marker not found')
              c = c.replace(marker, insert + marker, 1)

          old = "recheckTimer=setTimeout(()=>recheckSavedCards(false),1200)"
          new = "recheckTimer=setTimeout(async()=>{await refreshMasterPrices();recheckSavedCards(false)},800)"
          if old not in c:
              raise SystemExit('collection timer marker not found')
          c = c.replace(old, new, 1)
          collection.write_text(c)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CARD CRATE CLUB/netlify/functions/refresh-card-prices.js' 'CARD CRATE CLUB/collection.html'
          git commit -m 'Repair master pricing queue and fallback' || exit 0
          git push
