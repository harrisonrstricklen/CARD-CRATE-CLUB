name: Test Ascended master pricing
on:
  push:
    paths:
      - '.github/workflows/test-ascended-master.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose TCGCSV matching
        run: |
          python - <<'PY'
          import json,re,urllib.request,collections
          from pathlib import Path
          def norm(v):
              import unicodedata
              s=unicodedata.normalize('NFKD',str(v or '')); s=''.join(ch for ch in s if not unicodedata.combining(ch)).lower().replace('’',"'").replace('‘',"'")
              s=re.sub(r"[^a-z0-9' -]+",' ',s); return re.sub(r'\s+',' ',s).strip()
          def num(v):
              s=str(v or '').strip().lower().split('/')[0].strip(); return str(int(s)) if s.isdigit() else s
          def pnum(p):
              if p.get('number') or p.get('cardNumber'): return num(p.get('number') or p.get('cardNumber'))
              for row in p.get('extendedData') or []:
                  if norm(row.get('name') or row.get('displayName')) in ('number','card number'): return num(row.get('value'))
              return ''
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'CardCrateClub diagnostic/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          raw=json.loads(Path('CARD CRATE CLUB/card-data/all-cards-index.json').read_text()); cards=raw if isinstance(raw,list) else raw.get('cards',[])
          setcards=[c for c in cards if norm(c.get('setName'))==norm('Ascended Heroes')]
          products=get('https://tcgcsv.com/tcgplayer/3/24541/products').get('results',[])
          prices=get('https://tcgcsv.com/tcgplayer/3/24541/prices').get('results',[]); by={}
          for r in prices:by.setdefault(int(r.get('productId',0)),[]).append(r)
          for p in products:
              if pnum(p)=='10' or 'meganium' in norm(p.get('name') or p.get('cleanName')):
                  print('CANDIDATE',p.get('productId'),p.get('name'),pnum(p),p.get('extendedData'))
                  print('PRICES',by.get(int(p.get('productId',0)),[]))
          counts=collections.Counter(pnum(p) for p in products if pnum(p))
          dups=[(n,c) for n,c in counts.items() if c>1]
          print('NUMBER_COUNTS unique',len(counts),'duplicates',len(dups),'sample',dups[:30])
          for target in ['10','180']:
              print('NUMBER',target,'products',[(p.get('productId'),p.get('name'),pnum(p)) for p in products if pnum(p)==target])
          print('LOCAL',[(c.get('id'),c.get('name'),c.get('number')) for c in setcards if num(c.get('number')) in ('10','180')])
          PY
