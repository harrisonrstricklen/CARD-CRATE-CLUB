name: Benchmark master set pricing
on:
  push:
    paths:
      - '.github/workflows/benchmark-master-set-pricing.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Benchmark Ascended Heroes master pricing build
        run: |
          python - <<'PY'
          import json, time, urllib.request

          GROUP_ID = 24541
          BASE = f'https://tcgcsv.com/tcgplayer/3/{GROUP_ID}'

          def get_json(url):
              start = time.perf_counter()
              req = urllib.request.Request(url, headers={'User-Agent':'CardCrateClub benchmark'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
              elapsed = time.perf_counter() - start
              return json.loads(raw), elapsed, len(raw)

          overall = time.perf_counter()
          products, product_s, product_bytes = get_json(BASE + '/products')
          prices, price_s, price_bytes = get_json(BASE + '/prices')

          cpu_start = time.perf_counter()
          products_list = products.get('results', [])
          price_rows = prices.get('results', [])
          prices_by_product = {}
          for row in price_rows:
              prices_by_product.setdefault(int(row.get('productId') or 0), []).append(row)

          master = []
          with_price = 0
          for p in products_list:
              pid = int(p.get('productId') or 0)
              rows = prices_by_product.get(pid, [])
              markets = [r.get('marketPrice') for r in rows if isinstance(r.get('marketPrice'), (int,float)) and r.get('marketPrice') > 0]
              market = min(markets) if markets else None
              if market is not None:
                  with_price += 1
              master.append({
                  'productId': pid,
                  'name': p.get('name') or p.get('cleanName'),
                  'marketPrice': market,
                  'variants': len(rows)
              })
          cpu_s = time.perf_counter() - cpu_start
          total_s = time.perf_counter() - overall

          print('BENCHMARK_RESULT')
          print(json.dumps({
              'groupId': GROUP_ID,
              'products': len(products_list),
              'priceRows': len(price_rows),
              'productsWithPrice': with_price,
              'productsWithoutPrice': len(products_list)-with_price,
              'productFetchSeconds': round(product_s,3),
              'priceFetchSeconds': round(price_s,3),
              'localBuildSeconds': round(cpu_s,3),
              'totalSeconds': round(total_s,3),
              'downloadBytes': product_bytes + price_bytes
          }, indent=2))
          PY