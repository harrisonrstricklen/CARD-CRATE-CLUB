name: Repair pricing pipeline
on:
  push:
    paths:
      - 'tools/repair-pricing-pipeline.py'
      - 'CARD CRATE CLUB/netlify/functions/_tcgcsv.js'
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python tools/repair-pricing-pipeline.py
      - name: Test resolver against real Ascended Heroes data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { resolveTcgcsvCards }=require('./CARD CRATE CLUB/netlify/functions/_tcgcsv');
          const set=JSON.parse(fs.readFileSync('CARD CRATE CLUB/card-data/all-sets/me2pt5.json','utf8'));
          const names=['Mega Meganium ex',"Acerola's Mischief"];
          const cards=names.map(name=>set.cards.find(c=>c.name===name)).filter(Boolean).map(c=>({...c,setName:set.name,variance:c.name==='Mega Meganium ex'?'Holofoil':''}));
          const resolved=await resolveTcgcsvCards(cards);
          for(const card of cards){
            const hit=resolved.get(String(card.id));
            console.log(JSON.stringify({card:{id:card.id,name:card.name,number:card.number},resolved:hit},null,2));
            if(!hit) throw new Error(`No TCGCSV match for ${card.name} #${card.number}`);
            if(!hit.tcgplayerUrl || !/tcgplayer\.com\/product\//.test(hit.tcgplayerUrl)) throw new Error(`Missing TCGplayer URL for ${card.name}`);
            if(!(Number(hit.marketPrice)>0)) throw new Error(`Missing market price for ${card.name}`);
          }
          NODE
      - name: Syntax check
        run: |
          node --check 'CARD CRATE CLUB/netlify/functions/search-cards.js'
          node --check 'CARD CRATE CLUB/netlify/functions/refresh-card-prices.js'
          node --check 'CARD CRATE CLUB/netlify/functions/_tcgcsv.js'
      - name: Commit tested repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CARD CRATE CLUB/netlify/functions/search-cards.js' 'CARD CRATE CLUB/netlify/functions/refresh-card-prices.js'
          git commit -m 'Use tested TCGCSV fallback for prices and links' || exit 0
          git push
