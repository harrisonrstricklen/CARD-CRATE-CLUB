name: Apply pricing fix
on:
  push:
    paths:
      - '.github/workflows/apply-pricing-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python 'CARD CRATE CLUB/tools/apply-pricing-fix.py'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'CARD CRATE CLUB/netlify/functions/seed-ascended-heroes-master.js' 'CARD CRATE CLUB/netlify/functions/search-cards.js' 'CARD CRATE CLUB/collection.html'
          git commit -m 'Repair pricing pipeline with tested TCGplayer fallback' || exit 0
          git push
# run 2
